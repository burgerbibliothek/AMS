name: Filament Upgrade

on:
  schedule:
    - cron: "0 6 * * *"   # täglich 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: filament-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo, pdo_mysql, zip, gd, bcmath, exif
          tools: composer:v2

      - name: Abhängigkeiten installieren
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Aktuelle und neueste Filament-Version ermitteln
        id: versions
        run: |
          CURRENT=$(jq -r '.packages[] | select(.name=="filament/filament") | .version' composer.lock | sed 's/^v//')
          MAJOR=${CURRENT%%.*}

          # Neueste stabile Version innerhalb derselben Major-Version (Pre-Releases ausgeschlossen)
          LATEST=$(curl -fsSL https://repo.packagist.org/p2/filament/filament.json \
            | jq -r '.packages["filament/filament"][].version' \
            | sed 's/^v//' \
            | grep -E "^${MAJOR}\.[0-9]+\.[0-9]+$" \
            | sort -V | tail -1)

          echo "Aktuell: $CURRENT | Neueste: $LATEST"

          # Upgrade nur, wenn LATEST strikt größer ist als CURRENT
          NEWER=$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | tail -1)
          if [ "$LATEST" != "$CURRENT" ] && [ "$NEWER" = "$LATEST" ]; then
            echo "upgrade=true" >> "$GITHUB_OUTPUT"
          else
            echo "upgrade=false" >> "$GITHUB_OUTPUT"
          fi
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Filament upgraden
        if: steps.versions.outputs.upgrade == 'true'
        run: |
          composer require "filament/filament:^${{ steps.versions.outputs.latest }}" \
            --with-all-dependencies --no-interaction --no-progress
          php artisan filament:upgrade || true

      - name: Tests ausführen (optional)
        if: steps.versions.outputs.upgrade == 'true'
        continue-on-error: true
        run: |
          cp -n .env.example .env || true
          php artisan key:generate || true
          php artisan test

      - name: Pull Request erstellen
        if: steps.versions.outputs.upgrade == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/filament-${{ steps.versions.outputs.latest }}
          base: main
          commit-message: "chore: Upgrade Filament auf ${{ steps.versions.outputs.latest }}"
          title: "Upgrade Filament auf ${{ steps.versions.outputs.latest }}"
          body: |
            Automatisches Upgrade auf Filament **${{ steps.versions.outputs.latest }}**.

            Bitte den [Changelog](https://github.com/filamentphp/filament/releases) prüfen und die Tests abwarten.
          labels: dependencies
          delete-branch: true
